services:
  weather:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /app/data/weather.sqlite
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - weather-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  weather-data:
